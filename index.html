<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only this site's own files may run or load. The only server the page may talk to is the team backend
     in connect-src (the same URL as config.js); 'none' when team features are off. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0f1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FitTrack">
<title>FitTrack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{
  --bg:#0f1115;--surface:#181b22;--surface2:#222630;--line:#2c313c;
  --text:#eceef2;--muted:#9aa1ad;--faint:#6b7280;
  --accent:#4f8cff;--accent-ink:#fff;
  --lift:#4f8cff;--cardio:#ff8a4c;--weight:#3ecf8e;--bf:#2ec5c5;--sleep:#a78bfa;--food:#f472b6;
  --good:#3ecf8e;--bad:#ff6b6b;--gold:#f5c04c;
  --radius:14px;color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --bg:#f3f4f7;--surface:#fff;--surface2:#eef0f4;--line:#dde1e8;
    --text:#14171c;--muted:#5d6471;--faint:#8a919c;
    --accent:#2f6fed;--lift:#2f6fed;--cardio:#e8692a;--weight:#17a86b;--bf:#0e9f9f;--sleep:#7c5ce6;--food:#d63f8c;
    --good:#17a86b;--bad:#d64545;--gold:#c98a00;color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
/* 16px inputs stop iPhone Safari from zooming in when a field is focused */
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
input::placeholder{color:var(--faint)}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
h2{font-size:18px}h3{font-size:15px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.grow{flex:1;min-width:0}

header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid var(--line);min-height:60px}
header.top h1{font-size:20px;padding-left:4px;flex:1}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted);flex:none}
.icon-btn:active{background:var(--surface2)}
.icon-btn svg{width:22px;height:22px}
.date-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:2px 0;border-radius:12px;position:relative}
.date-btn .dl{font-weight:700;font-size:17px}
.date-btn .ds{font-size:12px;color:var(--muted)}
.date-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;min-height:0;padding:0;border:0}

main{padding:12px 16px calc(88px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}
nav.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:6}
nav.bottom button{flex:1;padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:12px;font-weight:600}
nav.bottom button svg{width:24px;height:24px}
nav.bottom button.on{color:var(--accent)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.sec-title{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 2px 10px}
.sec-title h2{font-size:13px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.sec-title .acts{display:flex;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}

.btn{border-radius:10px;padding:10px 14px;background:var(--surface2);color:var(--text);font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px dashed var(--line);color:var(--muted);width:100%}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:active{filter:brightness(1.15)}
.row{display:flex;gap:8px;align-items:center}
.stack>*+*{margin-top:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px 10px}
.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.btn-row .btn{flex:1}

.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px}
.summary div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.summary b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.summary span{font-size:11px;color:var(--muted)}

.stepper{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface2);min-width:0}
.stepper button{width:36px;flex:none;font-size:20px;color:var(--muted)}
.stepper button:active{background:var(--line)}
.stepper input{border:0;border-radius:0;text-align:center;padding:8px 0;min-width:0;width:100%;background:transparent;font-weight:600;font-variant-numeric:tabular-nums}
.stepper input:focus{outline:none}
.field-label{font-size:12px;color:var(--muted);margin:0 0 4px 2px;display:block}
.field-hint{font-size:11.5px;color:var(--faint);margin:4px 0 0 2px;min-height:15px}

.list-row{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 2px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row .t{font-weight:600}
.list-row .s{font-size:13px;color:var(--muted)}
.list-row .r{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;flex:none}

.ex-card .ex-name{font-weight:700;font-size:16px}
.ex-card .ex-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.set-chip{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.set-chip b{color:var(--muted);font-weight:600;margin-right:4px}
.set-chip.pr{border-color:var(--gold)}
.set-input{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:end}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0 4px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:9px 0;border-radius:9px;font-weight:600;color:var(--muted);font-size:14px}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.25)}
.badge{font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:1px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.tile .v small{font-size:13px;color:var(--muted);font-weight:600;margin-left:2px}
.tile .l{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:10px;font-family:inherit}
.empty{padding:26px 8px;text-align:center;color:var(--muted);font-size:14px}
.hbar{height:6px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden}
.hbar i{display:block;height:100%;border-radius:3px}
.goal{padding:9px 0}
.goal+.goal{border-top:1px solid var(--line)}
.goal .gl{font-size:13.5px;font-weight:600}
.goal .gv{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.goal .gv b{color:var(--text)}
.goal .gn{font-size:11.5px;color:var(--faint);margin-top:4px}
.pbar{height:8px;border-radius:4px;background:var(--surface2);margin-top:6px;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:4px;transition:width .3s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.banner{display:flex;gap:10px;align-items:center;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,var(--line));border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:13.5px}
.check{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--accent-ink);font-size:14px}
.check.on{background:var(--accent);border-color:var(--accent)}
table.hist{width:100%;border-collapse:collapse;font-size:13.5px}
table.hist td{padding:7px 2px;border-bottom:1px solid var(--line);vertical-align:top}
table.hist tr:last-child td{border-bottom:0}
table.hist td:last-child{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

#sheet{position:fixed;inset:0;z-index:20;display:none}
#sheet.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel.tall{height:88%}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--surface);border-radius:20px 20px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);max-width:640px;margin:0 auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:8px auto 0}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 18px}
.sheet-body{overflow:auto;padding:4px 16px 18px;flex:1}
.sheet-foot{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.sheet-foot .btn{flex:1}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.gold{background:var(--gold);color:#1a1300}
#lock{position:fixed;inset:0;z-index:40;background:var(--bg);display:none;align-items:center;justify-content:center;padding:24px}
#lock.open{display:flex}
#lock .lock-box{width:100%;max-width:340px;text-align:center}
#lock input{text-align:center;font-size:22px;letter-spacing:.3em;margin:18px 0 10px}
.err{color:var(--bad);font-size:13px;min-height:18px}
.rk-row{display:grid;grid-template-columns:28px 1fr auto;gap:4px 10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rk-row:last-child{border-bottom:0}
.rk-row.me{background:color-mix(in srgb,var(--accent) 10%,transparent);margin:0 -14px;padding:9px 14px}
.rk-pos{font-weight:700;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.rk-row:first-child .rk-pos{color:var(--gold)}
.rk-name{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk-val{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.rk-bar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--surface2);position:relative}
.rk-bar i{display:block;height:100%;border-radius:3px;background:var(--accent)}
.rk-bar b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);opacity:.55}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;font-weight:700;letter-spacing:.08em}
.toggle{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.toggle:last-child{border-bottom:0}
.switch{flex:none;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:.15s;margin-top:2px}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s}
.toggle.on .switch{background:var(--accent)}
.toggle.on .switch::after{left:21px}
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="view"></main>
<nav class="bottom" id="nav"></nav>
<div id="sheet"></div>
<div id="toast"></div>
<div id="lock" role="dialog" aria-label="Unlock FitTrack"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
